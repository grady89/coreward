<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mineral Review</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #07090f; }
    .tag {
      position: fixed; transform: translateX(-50%);
      font: 700 13px "Chakra Petch", system-ui, sans-serif; letter-spacing: 0.28em;
      color: #9a95a8; text-align: center; pointer-events: none;
    }
    .tag b { display: block; font-size: 10px; letter-spacing: 0.2em; color: #5c5870; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GEM_GEOS, gemClassOf, gemScaleOf, motionOf } from '/src/world/gemshapes.ts';
    import { T, TILE_DEFS } from '/src/world/tiles.ts';

    // Beauty-shot stage for the ore vocabulary, one mineral or the whole
    // roster (?m=all). Material and shader patch mirror the game's gemMat so
    // what this page shows is what the chunk renderer draws.
    const ROSTER = [
      { key: 'copper', t: T.COPPER, name: 'COPPER', sub: 'crusted lump' },
      { key: 'iron', t: T.IRON, name: 'IRON', sub: 'split cube' },
      { key: 'silver', t: T.SILVER, name: 'SILVER', sub: 'blade fan' },
      { key: 'gold', t: T.GOLD, name: 'GOLD', sub: 'the nugget' },
      { key: 'ruby', t: T.RUBY, name: 'RUBY', sub: 'beveled dome' },
      { key: 'voidopal', t: T.VOIDOPAL, name: 'VOIDOPAL', sub: 'the egg' },
      { key: 'diamond', t: T.DIAMOND, name: 'DIAMOND', sub: 'marquise' },
      { key: 'embershard', t: T.EMBERSHARD, name: 'EMBERSHARD', sub: 'star fragment' },
      { key: 'veinlight', t: T.FUNGUS, name: 'VEINLIGHT', sub: 'light pods' },
      { key: 'frostbloom', t: T.FROSTBLOOM, name: 'FROSTBLOOM', sub: 'urchin burst' },
      { key: 'rime-salt', t: T.NATIVE, name: 'RIME SALT', sub: 'crust slab' },
      { key: 'nacre', t: T.NACRE, name: 'NACRE', sub: 'shell fan' },
      { key: 'mimic', t: T.MIMIC, name: 'MIMIC', sub: 'the wrong egg' },
    ];
    const params = new URLSearchParams(location.search);
    const which = params.get('m') ?? 'all';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090f);

    // cave lighting: a dim cool wash and one warm headlamp-ish key — the gems
    // must carry themselves with their own emissive, as they do in a shaft
    scene.add(new THREE.HemisphereLight(0x30364a, 0x0a0a12, 0.5));
    const key = new THREE.DirectionalLight(0xffd9a8, 1.1);
    key.position.set(2, 3, 5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x5a7aff, 0.4);
    rim.position.set(-4, 1, -3);
    scene.add(rim);

    // the game's gem material, minus instancing: vColor is the baked tint
    const gemMat = () => {
      const m = new THREE.MeshStandardMaterial({
        vertexColors: true, flatShading: true,
        roughness: 0.16, metalness: 0.55,
        emissive: 0xffffff, emissiveIntensity: 0.55,
      });
      m.onBeforeCompile = shader => {
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <emissivemap_fragment>',
          '#include <emissivemap_fragment>\n\ttotalEmissiveRadiance *= vColor.rgb;'
        );
      };
      return m;
    };

    const gems = [];
    const roster = which === 'all' ? ROSTER : ROSTER.filter(r => r.key === which);
    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);

    const place = (r, x, y, scale) => {
      const m = gemMat();
      const hex = TILE_DEFS[r.t].gem || 0xcfe8ff;
      m.color.setHex(hex);
      m.emissive.setHex(hex);
      const mesh = new THREE.Mesh(GEM_GEOS[gemClassOf(r.t)], m);
      mesh.position.set(x, y, 0);
      mesh.scale.setScalar(scale * gemScaleOf(r.t));
      scene.add(mesh);
      gems.push({ mesh, r, motion: motionOf(gemClassOf(r.t)), phase: x * 2.1 });
      return mesh;
    };

    const tags = [];
    const tag = (worldPos, name, sub) => {
      const el = document.createElement('div');
      el.className = 'tag';
      el.innerHTML = `${name}<b>${sub}</b>`;
      document.body.appendChild(el);
      tags.push({ el, worldPos });
    };

    if (which === 'all') {
      // two shelves of the whole roster, labeled — the distinguishability test
      roster.forEach((r, i) => {
        const row = i < 7 ? 0 : 1;
        const col = i < 7 ? i : i - 7;
        const x = (col - (row === 0 ? 3 : 2.5)) * 1.5;
        const y = row === 0 ? 0.95 : -0.95;
        place(r, x, y, 1.35);
        tag(new THREE.Vector3(x, y - 0.72, 0), r.name, r.sub);
      });
      camera.position.set(0, 0, 11.2);
      camera.lookAt(0, 0, 0);
    } else {
      const r = roster[0];
      place(r, 0, 0, 2.6);
      tag(new THREE.Vector3(0, -1.35, 0), r.name, r.sub);
      camera.position.set(0, 0.35, 4.6);
      camera.lookAt(0, 0, 0);
    }

    const v = new THREE.Vector3();
    const clock = new THREE.Clock();
    let time = 2.1; // start mid-turn so a screenshot lands on a 3/4 view
    function frame() {
      const dt = Math.min(0.05, clock.getDelta());
      time += dt;
      for (const g of gems) {
        g.mesh.rotation.set(
          0.12 + Math.sin(time * 0.9 + g.phase) * g.motion.wobble,
          time * (0.3 + g.motion.spin * 0.5) + g.phase,
          Math.cos(time * 0.7 + g.phase) * g.motion.wobble,
        );
        const pulse = 1 + Math.sin(time * 1.8 + g.phase) * g.motion.pulse;
        const base = which === 'all' ? 1.35 : 2.6;
        g.mesh.scale.setScalar(base * gemScaleOf(g.r.t) * pulse);
      }
      for (const t of tags) {
        v.copy(t.worldPos).project(camera);
        t.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
        t.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
